id = "tlv.claude-context-meter"
name = "Claude Context Meter"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Claude Code context usage as a bar — in the status line and in a herdr pane"
platforms = ["macos", "linux"]

[[panes]]
id = "meter"
title = "Claude Context"
placement = "tab"
command = ["bash", "meter-pane.sh"]

[[actions]]
id = "open"
title = "Open context meter"
contexts = ["workspace"]
command = ["bash", "open-pane.sh"]
